# =============================================================================
# Fish Species API — Nginx (HTTP only, tanpa SSL)
# Gunakan file ini jika belum punya sertifikat SSL.
# Setelah SSL siap, pakai fish-species-api.conf
# =============================================================================

upstream fish_species_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    access_log /var/log/nginx/fish-species-api.access.log;
    error_log  /var/log/nginx/fish-species-api.error.log warn;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        proxy_pass http://fish_species_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /ready {
        proxy_pass http://fish_species_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://fish_species_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
