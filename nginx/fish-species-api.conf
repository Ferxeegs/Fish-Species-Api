# =============================================================================
# Fish Species API — Nginx Reverse Proxy
# =============================================================================
#
# Prasyarat:
#   - Container berjalan: docker compose up -d
#   - Port container ter-bind ke 127.0.0.1:5000 (lihat docker-compose.yml)
#
# Instalasi (Debian/Ubuntu):
#   sudo cp nginx/fish-species-api.conf /etc/nginx/sites-available/fish-species-api.conf
#   sudo ln -sf /etc/nginx/sites-available/fish-species-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL dengan Certbot:
#   sudo certbot --nginx -d api.example.com
#
# Ganti "api.example.com" dengan domain Anda di blok server di bawah.
# =============================================================================

upstream fish_species_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # --- SSL (sesuaikan path setelah certbot) ---
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Logging ---
    access_log /var/log/nginx/fish-species-api.access.log;
    error_log  /var/log/nginx/fish-species-api.error.log warn;

    # --- Upload (sesuai MAX_UPLOAD_SIZE_MB di .env) ---
    client_max_body_size 10M;

    # --- Security headers (tambahan di atas header dari aplikasi) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Health check (tanpa rate limit, untuk monitoring/load balancer) ---
    location = /health {
        proxy_pass http://fish_species_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /ready {
        proxy_pass http://fish_species_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- API utama ---
    location / {
        proxy_pass http://fish_species_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Inferensi ML butuh waktu lebih lama (sesuai GUNICORN_TIMEOUT)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffer upload gambar
        proxy_request_buffering on;
    }
}
