# Salin ke global-gateway conf.d (mis. /etc/nginx/conf.d/fish-species-api.conf).
# Pastikan gateway join jaringan Docker yang sama dengan stack app (app-bridge).
#
# Nama upstream mengikuti container_name di docker-compose.yml:
#   fish_species_api
# Jika di server Anda memakai nama lain, sesuaikan blok upstream di bawah.

upstream fish_species_api_backend {
    server fish_species_api:5000;
}

server {
    listen 80;
    server_name fish-species.ferxcode.my.id;

    client_max_body_size 10M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    access_log /var/log/nginx/fish-species-api.access.log;
    error_log  /var/log/nginx/fish-species-api.error.log warn;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 1. Liveness (monitoring / load balancer) ---
    location = /health {
        proxy_pass http://fish_species_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- 2. Readiness (model sudah dimuat) ---
    location = /ready {
        proxy_pass http://fish_species_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- 3. API (predict + endpoint lain) ---
    location / {
        proxy_pass http://fish_species_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Header X-API-Key dari client diteruskan otomatis ke container

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
