services:
  api:
    build: .
    container_name: fish_species_api
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      HOME: /tmp
      YOLO_CONFIG_DIR: /tmp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - app-bridge
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  app-bridge:
    external: true
